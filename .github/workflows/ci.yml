name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # No Perforce is installed: every test runs against the in-memory
      # MockP4Runner, so CI is fully offline.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Collect coverage
        if: matrix.node-version == 22
        run: npm run test:coverage
      - run: npm run build

  # Fast offline safety signal for studios (MockP4Runner only; no p4 binary).
  safety-bench:
    name: safety bench (offline MockP4Runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Offline safety bench (MockP4Runner, no real Perforce)
        run: npm run test:bench-safety
